services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicflow
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: clinicflow
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/clinicflow
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
